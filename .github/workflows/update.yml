name: Update IPTV List

on:
  schedule:
    - cron: "0 */6 * * *"   # 6 saatte bir
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scripti çalıştır
        run: |
          python sorter.py

      - name: Değişiklik varsa commit
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add tr_sorted.m3u
          git commit -m "Auto update sorted M3U" || echo "Değişiklik yok"
          git push
